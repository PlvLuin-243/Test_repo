<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ô nhập dữ liệu</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="number"],
        textarea,
        select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus,
        textarea:focus,
        select:focus {
            outline: none;
            border-color: #4CAF50;
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.3);
        }
        button {
            background-color: #4CAF50;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #45a049;
        }
    </style>
</head>
<body>
    <h2>Form nhập dữ liệu</h2>
    
    <form action="#" method="POST">
        <!-- Ô nhập text cơ bản -->
        <div class="form-group">
            <label for="name">Họ và tên:</label>
            <input type="text" id="name" name="name" placeholder="Luyn..." required>
        </div>

        <!-- Ô nhập email -->
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="example@email.com" required>
        </div>

        <!-- Ô nhập mật khẩu -->
        <div class="form-group">
            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu..." required>
        </div>

        <!-- Ô nhập số -->
        <div class="form-group">
            <label for="age">Tuổi:</label>
            <input type="number" id="age" name="age" min="1" max="100" placeholder="Nhập tuổi...">
        </div>

        <!-- Ô nhập ngày -->
        <div class="form-group">
            <label for="birthday">Ngày sinh:</label>
            <input type="date" id="birthday" name="birthday">
        </div>

        <!-- Ô chọn (radio) -->
        <div class="form-group">
            <label>Giới tính:</label>
            <input type="radio" id="male" name="gender" value="male">
            <label for="male" style="display:inline;">Nam</label>
            <input type="radio" id="female" name="gender" value="female">
            <label for="female" style="display:inline;">Nữ</label>
        </div>

        <!-- Ô chọn nhiều (checkbox) -->
        <div class="form-group">
            <label>Sở thích:</label>
            <input type="checkbox" id="reading" name="hobby" value="reading">
            <label for="reading" style="display:inline;">Đọc sách</label>
            <input type="checkbox" id="music" name="hobby" value="music">
            <label for="music" style="display:inline;">Âm nhạc</label>
        </div>

        <!-- Dropdown select -->
        <div class="form-group">
            <label for="city">Thành phố:</label>
            <select id="city" name="city">
                <option value="">-- Chọn thành phố --</option>
                <option value="hanoi">Hà Nội</option>
                <option value="hcm">TP. Hồ Chí Minh</option>
                <option value="danang">Đà Nẵng</option>
            </select>
        </div>

        <!-- Textarea -->
        <div class="form-group">
            <label for="message">Ghi chú:</label>
            <textarea id="message" name="message" rows="4" placeholder="Nhập ghi chú..."></textarea>
        </div>

        <!-- Nút submit -->
        <button type="submit">Gửi</button>
        <button type="reset" style="background-color:#f44336;">Xóa</button>
    </form>
</body>
</html>
